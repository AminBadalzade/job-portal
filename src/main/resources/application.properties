spring.application.name=jobportal

spring.datasource.url=jdbc:mysql://mysql:3306/job_board
spring.datasource.username=${MYSQL_USER:springstudent}
spring.datasource.password=${MYSQL_PASSWORD:springstudent}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.main.banner-mode=off
logging.level.root=WARN

jwt.secret=${JWT_SECRET:7f3c9a2e6d1b84f0c5a7e93b2d8f61ac}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

file.storage.location=/app/storage